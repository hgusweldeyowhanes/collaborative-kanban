services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: src/TaskFlow.Presentation/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=taskflow;Username=postgres;Password=postgres"
      Jwt__Secret: "LOCAL_DEV_SECRET_CHANGE_ME_AT_LEAST_32_CHARS_LONG"
      Jwt__Issuer: "TaskFlow.Presentation"
      Jwt__Audience: "TaskFlow.Client"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: "http://localhost:5000"
    depends_on:
      - api

volumes:
  postgres_data:
